name: Publish web app

# Builds the web app (docs/ + data from rule1/export_web.py) and publishes it on GitHub Pages.
# Runs after every daily update, when the web app changes, or by hand ("Run workflow").
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
on:
  workflow_run:
    workflows: ["Daily update"]
    types: [completed]
  push:
    branches: [main]
    paths: ["docs/**", "rule1/export_web.py", "rule1/bear_markets.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # the data the daily update just committed
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build the data files
        env:
          MANUAL_SHEET_ID: ${{ secrets.MANUAL_SHEET_ID }}
        run: python -m rule1.export_web docs/data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
