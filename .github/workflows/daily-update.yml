name: Daily update

on:
  schedule:
    - cron: "30 22 * * 1-5"  # after the US close, Monday to Friday
  workflow_dispatch:          # "Run workflow" button for a manual update
  push:                       # also run when the code or the watchlist changes
    branches: [main]
    paths: ["config/**", "rule1/**"]

permissions:
  contents: write

# One run at a time: overlapping runs both commit data and the second push fails.
concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch data
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
          MANUAL_SHEET_ID: ${{ secrets.MANUAL_SHEET_ID }}
        run: python -m rule1.update
      - name: Save new data
        run: |
          git config user.name "watchlist-bot"
          git config user.email "watchlist-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Data update $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
